name: Docs

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - docs/**
      - .github/workflows/docs.yml

# We need some permissions to publish to Github Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore tools
        run: dotnet tool restore
      - name: Build code
        run: dotnet build MVUish.Avalonia.slnx -c Release
      - name: Generate the documentation
        run: dotnet fsdocs build --properties Configuration=Release
      - name: Upload documentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

  # GitHub Actions recommends deploying in a separate job.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
